<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" preserveAspectRatio="xMidYMid slice">
  <!-- Imagen institucional ilustrada para el login (diseno propio TechUY) -->
  <defs>
    <linearGradient id="cielo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14b8a6"/>
      <stop offset="1" stop-color="#0f766e"/>
    </linearGradient>
    <pattern id="ventanas" width="60" height="56" patternUnits="userSpaceOnUse">
      <rect x="10" y="10" width="38" height="30" rx="4" fill="#ccfbf1" opacity=".55"/>
    </pattern>
  </defs>
  <rect width="1200" height="900" fill="url(#cielo)"/>
  <circle cx="980" cy="170" r="120" fill="#5eead4" opacity=".35"/>
  <circle cx="160" cy="120" r="70" fill="#99f6e4" opacity=".25"/>
  <!-- Edificio del hospital -->
  <rect x="300" y="250" width="600" height="650" fill="#f0fdfa" opacity=".92"/>
  <rect x="330" y="300" width="540" height="420" fill="url(#ventanas)"/>
  <rect x="120" y="430" width="200" height="470" fill="#e6fffb" opacity=".85"/>
  <rect x="880" y="400" width="220" height="500" fill="#e6fffb" opacity=".85"/>
  <rect x="140" y="460" width="160" height="380" fill="url(#ventanas)"/>
  <rect x="900" y="430" width="180" height="420" fill="url(#ventanas)"/>
  <!-- Cruz -->
  <rect x="540" y="150" width="120" height="120" rx="16" fill="#ffffff"/>
  <rect x="585" y="170" width="30" height="80" fill="#0f766e"/>
  <rect x="560" y="195" width="80" height="30" fill="#0f766e"/>
  <!-- Puerta -->
  <rect x="530" y="760" width="140" height="140" rx="8" fill="#0f766e" opacity=".8"/>
  <!-- Codigo QR estilizado -->
  <g transform="translate(980 640)" opacity=".9">
    <rect width="150" height="150" rx="12" fill="#ffffff"/>
    <rect x="15" y="15" width="40" height="40" fill="#0f172a"/>
    <rect x="95" y="15" width="40" height="40" fill="#0f172a"/>
    <rect x="15" y="95" width="40" height="40" fill="#0f172a"/>
    <rect x="70" y="70" width="15" height="15" fill="#0f172a"/>
    <rect x="95" y="95" width="15" height="15" fill="#0f172a"/>
    <rect x="120" y="120" width="15" height="15" fill="#0f172a"/>
    <rect x="70" y="110" width="15" height="25" fill="#0f172a"/>
  </g>
</svg>
